name: Build Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
        shell: bash
      - run: npm test
      - name: Numéro de version (0.1.N)
        run: npm version 0.1.${{ github.run_number }} --no-git-tag-version
        shell: bash
      - name: Identifiants Google intégrés (secrets GOOGLE_CLIENT_ID et GOOGLE_CLIENT_SECRET)
        shell: bash
        env:
          GID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GSEC: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GID" ] || [ -z "$GSEC" ]; then echo "::error::Secrets GOOGLE_CLIENT_ID et GOOGLE_CLIENT_SECRET manquants (Settings > Secrets and variables > Actions)"; exit 1; fi
          node -e "require('fs').writeFileSync('src/main/google.generated.js', 'module.exports = ' + JSON.stringify({clientId: process.env.GID, clientSecret: process.env.GSEC}) + ';')"
      - name: Construire l'installateur
        run: npx electron-builder --win --x64 --publish never
      - name: Publier la release (lue par la mise à jour automatique)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release create "v$V" "dist/AGOA-COMPTA-Setup-$V.exe" "dist/AGOA-COMPTA-Setup-$V.exe.blockmap" dist/latest.yml --title "$V" --notes "Version $V" --latest
