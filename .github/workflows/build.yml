name: Build Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
        shell: bash
      - run: npm test
      - name: Numéro de version (0.1.N)
        run: npm version 0.1.${{ github.run_number }} --no-git-tag-version
        shell: bash
      - name: Construire et publier la release (lue par la mise à jour automatique)
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
