<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; frame-src blob:; child-src blob:; font-src 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGOA COMPTA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root"></div>
<aside id="viewer" hidden aria-label="Visionneuse PDF">

<div id="toast" role="status" hidden></div>
<script src="../core/calc.js"></script>
